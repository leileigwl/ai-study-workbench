<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="AI Study Workbench 四步资料驱动型防剧透伴学流程图">
  <defs>
    <linearGradient id="bgGradZh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <marker id="arrowZh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="952" height="242" rx="16" fill="url(#bgGradZh)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="480" y="34" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    资料驱动型防剧透伴学四步闭环 (socratic-workbench)
  </text>

  <!-- Step 1 -->
  <rect x="24" y="58" width="202" height="164" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="24" y="58" width="202" height="32" rx="12" fill="#dbeafe"/>
  <rect x="24" y="78" width="202" height="12" fill="#dbeafe"/>
  <text x="125" y="79" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#1e40af">1. 喂给 AI 真实资料</text>
  <text x="125" y="114" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">课本 / 专业书 / 代码 / 考纲</text>
  <text x="125" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">先提炼核心机理与直觉误区</text>
  <text x="125" y="156" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">标准答案独立藏进隐藏文件：</text>
  <rect x="46" y="172" width="158" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="125" y="190" text-anchor="middle" font-family="ui-monospace,PingFang SC,monospace" font-size="11.5" font-weight="600" fill="#1d4ed8">answer_key (隔离防看)</text>

  <line x1="226" y1="140" x2="254" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowZh)"/>

  <!-- Step 2 -->
  <rect x="260" y="58" width="202" height="164" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="260" y="58" width="202" height="32" rx="12" fill="#e0f2fe"/>
  <rect x="260" y="78" width="202" height="12" fill="#e0f2fe"/>
  <text x="361" y="79" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#0369a1">2. 盲答练习本先练</text>
  <text x="361" y="114" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">零剧透盲答 + 反例追问</text>
  <text x="361" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">概念仅标 (共N个点)，漏点只反问</text>
  <text x="361" y="156" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">代码写四步大白话 -> 1:1 跑单测</text>
  <rect x="282" y="172" width="158" height="28" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="361" y="190" text-anchor="middle" font-family="ui-monospace,PingFang SC,monospace" font-size="11.5" font-weight="600" fill="#0369a1">workbench (绝不泄题)</text>

  <line x1="462" y1="140" x2="490" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowZh)"/>

  <!-- Step 3 -->
  <rect x="496" y="58" width="202" height="164" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="496" y="58" width="202" height="32" rx="12" fill="#d1fae5"/>
  <rect x="496" y="78" width="202" height="12" fill="#d1fae5"/>
  <text x="597" y="79" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#047857">3. 解锁标准答案背诵</text>
  <text x="597" y="114" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">过关后才解锁精炼答案</text>
  <text x="597" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">生成黑体关键词记忆卡</text>
  <text x="597" y="156" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">或点拨 1~2 个高手代码写法</text>
  <rect x="520" y="172" width="154" height="28" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="597" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="600" fill="#047857">强化对照与核心背诵</text>

  <line x1="698" y1="140" x2="726" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowZh)"/>

  <!-- Step 4 -->
  <rect x="732" y="58" width="204" height="164" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="732" y="58" width="204" height="32" rx="12" fill="#ede9fe"/>
  <rect x="732" y="78" width="204" height="12" fill="#ede9fe"/>
  <text x="834" y="79" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">4. 标准答案脱稿模拟</text>
  <text x="834" y="114" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#1e293b">严厉考官 / 现场压力追问</text>
  <text x="834" y="138" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">拿着第 1 步标准答案当评分卡</text>
  <text x="834" y="156" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#475569">逼你不看笔记脱口实战运用</text>
  <rect x="756" y="172" width="156" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="834" y="190" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="600" fill="#5b21b6">闭卷真正能考能用</text>
</svg>
